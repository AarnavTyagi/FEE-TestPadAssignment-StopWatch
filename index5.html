<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stopwatch</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
  <label id="time" for="start-btn">00:00:00</label>

  <div class="controls">
    <button type="button" id="lap-btn" class="round-btn lap" disabled>Lap</button>
    <button type="button" id="start-btn" class="round-btn start">Start</button>
  </div>

  <ul id="laps"></ul>
</div>
<script src="index.js"></script>
</body>
</html>
